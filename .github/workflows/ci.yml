name: CI Quality, Coverage & Podman Security Gates

on:
  pull_request:
    branches: [ main ]
  push:
    branches: [ main ]

jobs:
  lint-go:
    name: Lint Go Gateway
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.24'
      - name: Run golangci-lint
        uses: golangci/golangci-lint-action@v6
        with:
          version: latest
          args: --timeout=5m

  lint-python:
    name: Lint Python ML Service
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Linting Tools
        run: |
          python -m pip install --upgrade pip
          pip install ruff mypy
      - name: Run Ruff
        run: ruff check .
      - name: Run MyPy
        run: mypy .

  lint-frontend:
    name: Lint Frontend
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Run Biome Check
        run: npx @biomejs/biome ci .

  test-and-coverage:
    name: Test Suites & 85% Coverage Gate
    runs-on: ubuntu-latest
    needs: [lint-go, lint-python, lint-frontend]
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.24'
      - name: Run Tests with Coverage
        run: go test -v -coverprofile=coverage.out ./...
      - name: Verify 85% Minimum Coverage Threshold
        run: |
          COVERAGE=$(go tool cover -func=coverage.out | grep total | awk '{print substr($3, 1, length($3)-1)}')
          echo "Current Total Coverage: $COVERAGE%"
          REQUIRED=85.0
          if (( $(echo "$COVERAGE < $REQUIRED" | bc -l) )); then
            echo "ERROR: Code coverage is below mandatory threshold of $REQUIRED%!"
            exit 1
          fi

  podman-rocky-build-scan:
    name: Rocky Linux 9 Podman Build & Security Gate
    runs-on: ubuntu-latest
    needs: [test-and-coverage]
    container:
      image: rockylinux:9
      options: --privileged
    steps:
      - name: Install Tools
        run: dnf install -y git podman
      - name: Checkout Code
        uses: actions/checkout@v4
      - name: Build OCI Image
        run: |
          podman build -t campfire-backend:ci -f Containerfile .
          podman save -o campfire-image.tar campfire-backend:ci
      - name: Run Trivy Scanner
        run: |
          rpm -ivh https://github.com/aquasecurity/trivy/releases/download/v0.58.2/trivy_0.58.2_Linux-64bit.rpm
          trivy image --input campfire-image.tar --severity HIGH,CRITICAL --exit-code 1