events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    # Logging format optimized for structured JSON parsing
    log_format json_combined escape=json
      '{"time_local":"$time_local",'
      '"client_ip":"$remote_addr",'
      '"request":"$request",'
      '"status": "$status",'
      '"bytes_sent":"$body_bytes_sent",'
      '"request_time":"$request_time",'
      '"http_referrer":"$http_referer",'
      '"http_user_agent":"$http_user_agent",'
      '"x_correlation_id":"$http_x_correlation_id"}';

    access_log /var/log/nginx/access.log json_combined;
    error_log  /var/log/nginx/error.log warn;

    # Upstream services
    upstream go_gateway {
        server backend:8080 max_fails=3 fail_timeout=10s;
        keepalive 32;
    }

    server {
        listen 80;
        server_name _;

        # Client body & timeout limits
        client_max_body_size 10M;
        client_body_timeout 12;
        client_header_timeout 12;

        # REST API Routes
        location /api/ {
            proxy_pass http://go_gateway;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Correlation-ID $http_x_correlation_id;
            
            # Fast failover timeouts
            proxy_connect_timeout 5s;
            proxy_read_timeout 10s;
        }

        # WebSocket Tunneling for Live Telemetry & Emergency SOS Broadcasts
        location /ws/sos {
            proxy_pass http://go_gateway;
            proxy_http_version 1.1;

            # Mandatory headers for persistent WebSocket upgrading
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "Upgrade";

            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

            # Extended timeouts to prevent emergency alert socket dropping
            proxy_read_timeout 86400s;
            proxy_send_timeout 86400s;
            proxy_buffering off;
        }

        # Health check endpoint for container/orchestrator probes
        location /healthz {
            return 200 '{"status":"healthy"}';
            add_header Content-Type application/json;
        }
    }
}