version: '3.8'

services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: campfire-postgres
    restart: always
    environment:
      POSTGRES_DB: campfire_db
      POSTGRES_USER: campfire_user
      POSTGRES_PASSWORD: campfire_secure_password
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./database/init.sql:/docker-entrypoint-initdb.d/init.sql:Z

  nginx:
    image: nginx:alpine
    container_name: campfire-proxy
    restart: always
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro,Z
    depends_on:
      - postgres

  prometheus:
    image: prom/prometheus:latest
    container_name: campfire-prometheus
    restart: always
    ports:
      - "9090:9090"
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro,Z

  grafana:
    image: grafana/grafana:latest
    container_name: campfire-grafana
    restart: always
    ports:
      - "3000:3000"
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=admin
      - GF_USERS_ALLOW_SIGN_UP=false
    volumes:
      - ./monitoring/grafana-datasources.yml:/etc/grafana/provisioning/datasources/datasources.yml:ro,Z
      - ./monitoring/grafana-dashboard.json:/var/lib/grafana/dashboards/campfire.json:ro,Z
    depends_on:
      - prometheus

volumes:
  pgdata: